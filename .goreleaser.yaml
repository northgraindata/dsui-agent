version: 2

project_name: dsui-agent

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: dsui-agent
    main: ./cmd/dsui-agent
    binary: dsui-agent
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{ .Version }} -X main.commit={{ .ShortCommit }} -X main.date={{ .Date }}

archives:
  - id: default
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - deploy/systemd/*

  # Bare binaries with the platform in the name, for curl and for tools like
  # `gh release download --pattern`. Covered by checksums.txt like everything else.
  - id: raw
    formats: [binary]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

sboms:
  - artifacts: archive

# Keyless signature of the checksum file (verifies every archive through it).
signs:
  - cmd: cosign
    artifacts: checksum
    output: true
    args:
      - sign-blob
      - --yes
      - --output-signature=${signature}
      - --output-certificate=${certificate}
      - ${artifact}
    certificate: "${artifact}.pem"

nfpms:
  - id: packages
    package_name: dsui-agent
    vendor: Northgrain Data
    maintainer: Northgrain Data <joachim@northgraindata.com>
    homepage: https://github.com/northgraindata/dsui-agent
    description: Outbound-only connector that gives a DSUI instance access to private data sources.
    license: Apache-2.0
    formats: [deb, rpm]
    bindir: /usr/bin
    contents:
      - src: deploy/systemd/dsui-agent.service
        dst: /lib/systemd/system/dsui-agent.service
      - src: deploy/systemd/agent.yaml
        dst: /etc/dsui-agent/agent.yaml
        type: config|noreplace
    scripts:
      postinstall: deploy/systemd/postinstall.sh

dockers_v2:
  - id: image
    ids: [dsui-agent]
    dockerfile: Dockerfile
    images:
      - ghcr.io/northgraindata/dsui-agent
    tags:
      - "{{ .Version }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      org.opencontainers.image.source: https://github.com/northgraindata/dsui-agent
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.licenses: Apache-2.0

docker_signs:
  - cmd: cosign
    artifacts: images
    output: true
    args: [sign, --yes, "${artifact}@${digest}"]

# release-please owns the GitHub release notes and CHANGELOG.md.
changelog:
  disable: true

# Release-please writes the notes first; GoReleaser appends the install section.
release:
  mode: append
  prerelease: auto
  footer: |
    ## Install

    **Script (Linux, macOS)**

    ```sh
    curl -fsSL https://raw.githubusercontent.com/northgraindata/dsui-agent/{{ .Tag }}/install.sh | sh -s -- --version {{ .Tag }}
    ```

    **Docker**

    ```sh
    docker run --rm ghcr.io/northgraindata/dsui-agent:{{ .Version }} version
    ```

    **Kubernetes (Helm)**

    ```sh
    helm install dsui-agent oci://ghcr.io/northgraindata/charts/dsui-agent --version {{ .Version }} \
      --set dsui.url=https://dsui.example.com \
      --set token.existingSecret=dsui-agent-token \
      --set 'targets[0]=airflow-api.data.svc.cluster.local:8080'
    ```

    **Debian, Ubuntu**

    ```sh
    curl -fsSLO https://github.com/northgraindata/dsui-agent/releases/download/{{ .Tag }}/dsui-agent_{{ .Version }}_linux_amd64.deb
    sudo dpkg -i dsui-agent_{{ .Version }}_linux_amd64.deb
    ```

    **RHEL, Fedora, Amazon Linux**

    ```sh
    sudo rpm -i https://github.com/northgraindata/dsui-agent/releases/download/{{ .Tag }}/dsui-agent_{{ .Version }}_linux_amd64.rpm
    ```

    **Binary (Linux, macOS, Windows)**

    ```sh
    # pick your platform: linux|darwin|windows and amd64|arm64
    curl -fsSL -o dsui-agent https://github.com/northgraindata/dsui-agent/releases/download/{{ .Tag }}/dsui-agent_{{ .Version }}_linux_amd64
    chmod +x dsui-agent
    ./dsui-agent check --url https://dsui.example.com --token-file ./token --targets airflow.internal:8080
    ```

    See the [README](https://github.com/northgraindata/dsui-agent#examples) for Compose, systemd, Windows and ECS.

    ## Assets

    | Platform | Archive | Bare binary |
    | --- | --- | --- |
    | Linux x86_64 | `dsui-agent_{{ .Version }}_linux_amd64.tar.gz` | `dsui-agent_{{ .Version }}_linux_amd64` |
    | Linux arm64 | `dsui-agent_{{ .Version }}_linux_arm64.tar.gz` | `dsui-agent_{{ .Version }}_linux_arm64` |
    | macOS Intel | `dsui-agent_{{ .Version }}_darwin_amd64.tar.gz` | `dsui-agent_{{ .Version }}_darwin_amd64` |
    | macOS Apple silicon | `dsui-agent_{{ .Version }}_darwin_arm64.tar.gz` | `dsui-agent_{{ .Version }}_darwin_arm64` |
    | Windows x86_64 | `dsui-agent_{{ .Version }}_windows_amd64.zip` | `dsui-agent_{{ .Version }}_windows_amd64.exe` |
    | Windows arm64 | `dsui-agent_{{ .Version }}_windows_arm64.zip` | `dsui-agent_{{ .Version }}_windows_arm64.exe` |

    `.deb` and `.rpm` packages exist for amd64 and arm64.

    ## Verify

    ```sh
    sha256sum --ignore-missing -c checksums.txt

    cosign verify-blob checksums.txt \
      --certificate checksums.txt.pem --signature checksums.txt.sig \
      --certificate-identity-regexp 'https://github.com/northgraindata/dsui-agent/' \
      --certificate-oidc-issuer https://token.actions.githubusercontent.com

    cosign verify ghcr.io/northgraindata/dsui-agent:{{ .Version }} \
      --certificate-identity-regexp 'https://github.com/northgraindata/dsui-agent/' \
      --certificate-oidc-issuer https://token.actions.githubusercontent.com
    ```
