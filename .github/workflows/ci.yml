name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Test with race detector
        run: go test -race -count=1 ./...
      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.1
      - name: Cross-compile every release target
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 go build -trimpath -o /dev/null ./cmd/dsui-agent
          done

  release-config:
    name: Release and chart config
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Validate GoReleaser config
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: check
      - uses: azure/setup-helm@v4
      - name: Lint and render the Helm chart
        run: |
          helm lint deploy/helm/dsui-agent --set dsui.url=https://dsui.example.com --set token.value=x --set 'targets[0]=db.internal:5432'
          helm template t deploy/helm/dsui-agent --set dsui.url=https://dsui.example.com --set token.value=x --set 'targets[0]=db.internal:5432' > /dev/null
