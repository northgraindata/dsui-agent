{{- if and (not .Values.token.existingSecret) .Values.token.value }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dsui-agent.fullname" . }}
  labels:
    {{- include "dsui-agent.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.token.key }}: {{ .Values.token.value | quote }}
{{- end }}
